<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Raids — SpamViking</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:    #0D0D0B;
      --surface:  #161614;
      --surface2: #1E1E1B;
      --parchment:#E8E3D5;
      --muted:    #8A8578;
      --red:      #C0392B;
      --gold:     #B8963E;
      --gold-lt:  #D4AC52;
      --border:   #2A2A26;
      --green:    #27AE60;
      --blue:     #2980B9;
    }

    body {
      background: var(--black);
      color: var(--parchment);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                   Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: rgba(13,13,11,0.97);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: Impact, 'Arial Narrow', Arial, sans-serif;
      font-size: 20px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--parchment);
      text-decoration: none;
    }
    .logo span { color: var(--red); }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .viking-name {
      font-size: 13px;
      color: var(--muted);
    }
    .viking-name strong { color: var(--gold-lt); }

    .sign-out-btn {
      font-size: 12px;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }
    .sign-out-btn:hover { color: var(--parchment); }

    /* ── LAYOUT ── */
    main {
      padding: 100px 40px 80px;
      max-width: 960px;
      margin: 0 auto;
    }

    .page-title {
      font-family: Impact, 'Arial Narrow', Arial, sans-serif;
      font-size: clamp(28px, 4vw, 42px);
      text-transform: uppercase;
      letter-spacing: 0.01em;
      margin-bottom: 40px;
    }
    .page-title em { font-style: normal; color: var(--red); }

    /* ── SECTION ── */
    section { margin-bottom: 52px; }

    .section-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .section-head h2 {
      font-family: Impact, 'Arial Narrow', Arial, sans-serif;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--parchment);
    }

    .count-badge {
      font-family: 'SF Mono', 'Fira Mono', monospace;
      font-size: 11px;
      color: var(--gold);
      letter-spacing: 0.08em;
    }

    /* ── CARDS ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
    }

    .card-email {
      font-family: 'SF Mono', 'Fira Mono', monospace;
      font-size: 13px;
      color: var(--gold-lt);
      margin-bottom: 6px;
      word-break: break-all;
    }

    .card-meta {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    .status-pill {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 3px;
      margin-top: 8px;
      font-weight: 600;
    }
    .status-active   { background: #1a3a1a; color: var(--green); }
    .status-booked   { background: #1a2a3a; color: var(--blue); }
    .status-pending  { background: #2a2a1a; color: var(--gold); }
    .status-dead     { background: #2a1a1a; color: #888; }

    /* ── RECORDING CARD ── */
    .rec-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .rec-info { flex: 1; min-width: 0; }

    .rec-email {
      font-family: 'SF Mono', 'Fira Mono', monospace;
      font-size: 12px;
      color: var(--gold-lt);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rec-meta { font-size: 12px; color: var(--muted); }

    .play-btn {
      flex-shrink: 0;
      background: var(--red);
      color: var(--parchment);
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .play-btn:hover { background: #a93226; }
    .play-btn:disabled {
      background: #3a2020;
      color: #666;
      cursor: not-allowed;
    }

    /* ── SETTINGS ── */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 600px) {
      .settings-grid { grid-template-columns: 1fr; }
    }

    .setting-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
    }

    .setting-label {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .setting-select,
    .setting-toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--parchment);
      font-size: 14px;
      padding: 8px 10px;
      appearance: none;
      cursor: pointer;
    }
    select:focus { outline: 1px solid var(--gold); }

    .save-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--parchment);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .save-btn:hover { background: #2a2a28; }

    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; top: 3px;
      background: var(--muted);
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: #1a3a2a; }
    .toggle input:checked + .toggle-slider::before {
      transform: translateX(18px);
      background: var(--green);
    }

    .toggle-label {
      font-size: 14px;
      color: var(--parchment);
    }

    /* ── EMPTY / LOADING ── */
    .empty {
      color: var(--muted);
      font-size: 14px;
      padding: 20px 0;
    }

    .loading-line {
      height: 60px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .save-status {
      font-size: 12px;
      margin-top: 8px;
      color: var(--muted);
      min-height: 16px;
    }
    .save-status.ok  { color: var(--green); }
    .save-status.err { color: var(--red); }

    /* ── LOGIN GATE ── */
    #gate {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .gate-card {
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .eyebrow {
      font-family: 'SF Mono', 'Fira Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
    }

    .gate-card h1 {
      font-family: Impact, 'Arial Narrow', Arial, sans-serif;
      font-size: clamp(28px, 6vw, 44px);
      text-transform: uppercase;
      margin-bottom: 14px;
      line-height: 1;
    }
    .gate-card h1 em { font-style: normal; color: var(--red); }

    .gate-sub {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .gate-field {
      margin-bottom: 12px;
      text-align: left;
    }
    .gate-field label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .gate-field input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--parchment);
      font-size: 15px;
      padding: 12px 14px;
    }
    .gate-field input:focus { outline: 1px solid var(--gold); }
    .gate-field input::placeholder { color: var(--muted); }

    .gate-btn {
      width: 100%;
      background: var(--red);
      color: var(--parchment);
      border: none;
      border-radius: 5px;
      font-size: 15px;
      font-weight: 700;
      padding: 13px;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s;
    }
    .gate-btn:hover { background: #a93226; }
    .gate-btn:disabled { background: #6b1e16; cursor: not-allowed; }

    .gate-status {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }
    .gate-status.ok  { color: var(--green); }
    .gate-status.err { color: var(--red); }

    /* OTP step inside gate */
    #gate-otp { display: none; }

    footer {
      border-top: 1px solid var(--border);
      padding: 20px 40px;
      text-align: center;
    }
    footer p { font-size: 12px; color: var(--muted); }

    @media (max-width: 600px) {
      nav { padding: 14px 20px; }
      main { padding: 90px 20px 60px; }
      .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- LOGIN GATE -->
<div id="gate">
  <div class="gate-card">

    <!-- step 1: email -->
    <div id="gate-email">
      <p class="eyebrow">⚔ &nbsp;SpamViking</p>
      <h1>Log <em>in</em>.</h1>
      <p class="gate-sub">Enter your email and we'll send a
         one-time code.</p>
      <div class="gate-field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email"
               placeholder="you@example.com"
               autocomplete="email" />
      </div>
      <button class="gate-btn" id="login-send-btn">
        Send code
      </button>
      <div class="gate-status" id="login-email-status"></div>
    </div>

    <!-- step 2: OTP -->
    <div id="gate-otp">
      <p class="eyebrow">⚔ &nbsp;Check your inbox</p>
      <h1>Enter the <em>code</em>.</h1>
      <p class="gate-sub" id="otp-hint"></p>
      <div class="gate-field">
        <label for="login-otp">6-digit code</label>
        <input id="login-otp" type="text"
               placeholder="123456"
               maxlength="6"
               inputmode="numeric"
               autocomplete="one-time-code" />
      </div>
      <button class="gate-btn" id="login-verify-btn">
        Sign in
      </button>
      <div class="gate-status" id="login-otp-status"></div>
    </div>

  </div>
</div>

<!-- DASHBOARD (hidden until authed) -->
<div id="dashboard" style="display:none">

  <nav>
    <a class="logo" href="/">Spam<span>Viking</span></a>
    <div class="nav-right">
      <span class="viking-name">
        ⚔ <strong id="nav-name">…</strong>
      </span>
      <button class="sign-out-btn" id="sign-out-btn">Sign out</button>
    </div>
  </nav>

  <main>
    <h1 class="page-title">Your <em>raids</em>.</h1>

    <!-- PANEL 1: Active raids -->
    <section id="section-raids">
      <div class="section-head">
        <h2>Active raids</h2>
        <span class="count-badge" id="raids-count"></span>
      </div>
      <div id="raids-loading">
        <div class="loading-line" style="margin-bottom:10px"></div>
        <div class="loading-line"></div>
      </div>
      <div id="raids-content" class="card-grid" style="display:none"></div>
    </section>

    <!-- PANEL 2: Booked calls -->
    <section id="section-booked">
      <div class="section-head">
        <h2>Booked calls</h2>
        <span class="count-badge" id="booked-count"></span>
      </div>
      <div id="booked-loading">
        <div class="loading-line"></div>
      </div>
      <div id="booked-content" class="card-grid" style="display:none"></div>
    </section>

    <!-- PANEL 3: Recordings -->
    <section id="section-recordings">
      <div class="section-head">
        <h2>Recordings</h2>
        <span class="count-badge" id="rec-count"></span>
      </div>
      <div id="rec-loading">
        <div class="loading-line" style="margin-bottom:10px"></div>
        <div class="loading-line"></div>
      </div>
      <div id="rec-content" style="display:none;
           display:flex; flex-direction:column; gap:10px"></div>
    </section>

    <!-- PANEL 4: Settings -->
    <section id="section-settings">
      <div class="section-head">
        <h2>Settings</h2>
      </div>
      <div id="settings-loading">
        <div class="loading-line"></div>
      </div>
      <div id="settings-content" class="settings-grid"
           style="display:none">

        <!-- Email notifications toggle -->
        <div class="setting-card">
          <div class="setting-label">Email notifications</div>
          <div class="toggle-wrap">
            <label class="toggle">
              <input type="checkbox" id="notify-toggle" />
              <span class="toggle-slider"></span>
            </label>
            <span class="toggle-label" id="notify-label">On</span>
          </div>
          <div class="save-status" id="notify-status"></div>
        </div>

        <!-- Frequency -->
        <div class="setting-card">
          <div class="setting-label">Update frequency</div>
          <div class="setting-select">
            <select id="freq-select">
              <option value="weekly">Weekly roundup</option>
              <option value="off">Off</option>
            </select>
            <button class="save-btn" id="freq-save-btn">Save</button>
          </div>
          <div class="save-status" id="freq-status"></div>
        </div>

        <!-- Timezone -->
        <div class="setting-card" style="grid-column: 1 / -1">
          <div class="setting-label">Your time zone</div>
          <div class="setting-select">
            <select id="tz-select"></select>
            <button class="save-btn" id="tz-save-btn">Save</button>
          </div>
          <div class="save-status" id="tz-status"></div>
        </div>

      </div>
    </section>

  </main>

  <footer>
    <p>© 2026 SpamViking. All raids reserved.</p>
  </footer>

</div><!-- /dashboard -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://lxmzwftmshqghkyapibg.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_C3ypBZmycobb3Nf7_rVBbA_a-lzYp0G'
  const PE_BASE      = 'https://posture-engine.vercel.app'

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

  const TZ_OPTIONS = [
    ['Pacific/Honolulu',    'Hawaii (UTC−10)'],
    ['America/Anchorage',   'Alaska (UTC−9)'],
    ['America/Los_Angeles', 'Pacific (UTC−8/−7)'],
    ['America/Denver',      'Mountain (UTC−7/−6)'],
    ['America/Chicago',     'Central (UTC−6/−5)'],
    ['America/New_York',    'Eastern (UTC−5/−4)'],
    ['America/Halifax',     'Atlantic (UTC−4/−3)'],
    ['America/Sao_Paulo',   'Brasília (UTC−3)'],
    ['Europe/London',       'London (UTC+0/+1)'],
    ['Europe/Paris',        'Central Europe (UTC+1/+2)'],
    ['Europe/Helsinki',     'Eastern Europe (UTC+2/+3)'],
    ['Asia/Dubai',          'Gulf (UTC+4)'],
    ['Asia/Kolkata',        'India (UTC+5:30)'],
    ['Asia/Bangkok',        'Indochina (UTC+7)'],
    ['Asia/Singapore',      'Singapore (UTC+8)'],
    ['Asia/Tokyo',          'Japan (UTC+9)'],
    ['Australia/Sydney',    'Sydney (UTC+10/+11)'],
    ['Pacific/Auckland',    'New Zealand (UTC+12/+13)'],
  ]

  // ── helpers ──────────────────────────────────────────────

  async function rpc(name, body = {}) {
    const { data: { session } } = await sb.auth.getSession()
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/rpc/${name}`,
      {
        method: 'POST',
        headers: {
          'apikey':        SUPABASE_KEY,
          'Authorization': `Bearer ${session.access_token}`,
          'Content-Type':  'application/json'
        },
        body: JSON.stringify(body)
      }
    )
    if (!res.ok) {
      const t = await res.text()
      throw new Error(`${name} HTTP ${res.status}: ${t}`)
    }
    return res.json()
  }

  function fmtDate(iso) {
    if (!iso) return ''
    return new Date(iso).toLocaleDateString('en-US',
      { month: 'short', day: 'numeric', year: 'numeric' })
  }

  function statusPill(status) {
    const map = {
      active:         ['status-active',  'In progress'],
      booked:         ['status-booked',  'Call booked'],
      pending_review: ['status-pending', 'Under review'],
      dead:           ['status-dead',    'Closed'],
    }
    const [cls, label] = map[status] || ['status-dead', status]
    return `<span class="status-pill ${cls}">${label}</span>`
  }

  function show(id)  { document.getElementById(id).style.display = '' }
  function hide(id)  { document.getElementById(id).style.display = 'none' }
  function setText(id, v) { document.getElementById(id).textContent = v }

  // ── LOGIN GATE ────────────────────────────────────────────

  let loginEmail = ''

  document.getElementById('login-send-btn')
    .addEventListener('click', async () => {
      const email = document.getElementById('login-email').value.trim()
      const st    = document.getElementById('login-email-status')
      const btn   = document.getElementById('login-send-btn')

      if (!email || !email.includes('@')) {
        st.className = 'gate-status err'
        st.textContent = 'Enter a valid email.'
        return
      }

      btn.disabled = true
      btn.textContent = 'Sending…'
      st.className = 'gate-status'
      st.textContent = ''

      const { error } = await sb.auth.signInWithOtp({ email })

      if (error) {
        st.className = 'gate-status err'
        st.textContent = 'Could not send code. Try again.'
        btn.disabled = false
        btn.textContent = 'Send code'
        return
      }

      loginEmail = email
      document.getElementById('otp-hint').textContent =
        `We sent a code to ${email}.`
      hide('gate-email')
      show('gate-otp')
    })

  async function doLoginVerify() {
    const code = document.getElementById('login-otp').value.trim()
    const st   = document.getElementById('login-otp-status')
    const btn  = document.getElementById('login-verify-btn')

    if (!code || code.length < 6) {
      st.className = 'gate-status err'
      st.textContent = 'Enter the 6-digit code.'
      return
    }

    btn.disabled = true
    btn.textContent = 'Verifying…'
    st.className = 'gate-status'
    st.textContent = ''

    const { error } = await sb.auth.verifyOtp({
      email: loginEmail,
      token: code,
      type: 'email'
    })

    if (error) {
      st.className = 'gate-status err'
      st.textContent = 'Wrong or expired code.'
      btn.disabled = false
      btn.textContent = 'Sign in'
      return
    }

    await loadDashboard()
  }

  document.getElementById('login-verify-btn')
    .addEventListener('click', doLoginVerify)

  document.getElementById('login-otp')
    .addEventListener('keydown', e => {
      if (e.key === 'Enter') doLoginVerify()
    })

  // ── SIGN OUT ──────────────────────────────────────────────

  document.getElementById('sign-out-btn')
    .addEventListener('click', async () => {
      await sb.auth.signOut()
      location.reload()
    })

  // ── DASHBOARD LOAD ────────────────────────────────────────

  async function loadDashboard() {
    hide('gate')
    show('dashboard')

    // load in parallel
    await Promise.all([
      loadRaids(),
      loadBooked(),
      loadRecordings(),
      loadSettings()
    ])
  }

  // Panel 1 — raids
  async function loadRaids() {
    try {
      const rows = await rpc('dashboard_raids')
      hide('raids-loading')
      const el = document.getElementById('raids-content')
      el.style.display = ''

      const active = rows.filter(r => r.status !== 'dead')
      setText('raids-count', `${active.length} active`)

      if (!active.length) {
        el.innerHTML = '<p class="empty">No active raids yet.</p>'
        return
      }

      el.innerHTML = active.map(r => `
        <div class="card">
          <div class="card-email">${esc(r.email)}</div>
          <div class="card-meta">
            ${r.name ? esc(r.name) : ''}
            ${r.company ? ' · ' + esc(r.company) : ''}
          </div>
          <div class="card-meta">Started ${fmtDate(r.created_at)}</div>
          ${statusPill(r.status)}
        </div>
      `).join('')

      // Set nav name from prefs (loaded in parallel; fallback handled there)
    } catch (e) {
      console.error('raids', e)
      document.getElementById('raids-content').innerHTML =
        '<p class="empty" style="color:var(--red)">Could not load raids.</p>'
      hide('raids-loading')
      document.getElementById('raids-content').style.display = ''
    }
  }

  // Panel 2 — booked calls
  async function loadBooked() {
    try {
      const rows = await rpc('dashboard_booked')
      hide('booked-loading')
      const el = document.getElementById('booked-content')
      el.style.display = ''
      setText('booked-count', `${rows.length}`)

      if (!rows.length) {
        el.innerHTML = '<p class="empty">No calls booked yet.</p>'
        return
      }

      el.innerHTML = rows.map(r => `
        <div class="card">
          <div class="card-email">${esc(r.target_email)}</div>
          <div class="card-meta">
            ${r.discreet_label ? esc(r.discreet_label) : ''}
          </div>
          <div class="card-meta">
            ${r.host_name ? 'Host: ' + esc(r.host_name) : ''}
            ${r.booked_slot
              ? ' · ' + fmtDate(r.booked_slot)
              : ''}
          </div>
          <span class="status-pill status-booked">Booked</span>
        </div>
      `).join('')
    } catch (e) {
      console.error('booked', e)
    }
  }

  // Panel 3 — recordings
  async function loadRecordings() {
    try {
      const rows = await rpc('dashboard_web_calls')
      hide('rec-loading')
      const el = document.getElementById('rec-content')
      el.style.display = 'flex'
      el.style.flexDirection = 'column'
      el.style.gap = '10px'
      setText('rec-count', `${rows.length}`)

      if (!rows.length) {
        el.innerHTML = '<p class="empty">No recordings yet.</p>'
        return
      }

      // Render cards first, then fetch links asynchronously
      el.innerHTML = rows.map((r, i) => `
        <div class="rec-card" id="rec-${i}">
          <div class="rec-info">
            <div class="rec-email">${esc(r.target_email)}</div>
            <div class="rec-meta">
              ${fmtDate(r.started_at)}
              ${r.duration_seconds
                ? ' · ' + Math.round(r.duration_seconds / 60) + ' min'
                : ''}
              ${r.call_outcome ? ' · ' + esc(r.call_outcome) : ''}
            </div>
          </div>
          <button class="play-btn" id="play-${i}" disabled>
            Loading…
          </button>
        </div>
      `).join('')

      // Fetch recording links
      const { data: { session } } = await sb.auth.getSession()
      rows.forEach(async (r, i) => {
        const btn = document.getElementById(`play-${i}`)
        if (!r.vapi_call_id) {
          btn.textContent = 'No recording'
          return
        }
        try {
          const res = await fetch(
            `${PE_BASE}/api/recording-link?slug=${encodeURIComponent(r.vapi_call_id)}`,
            { headers: { 'x-phone-intake-secret': '' } }
          )
          if (!res.ok) throw new Error(res.status)
          const { url } = await res.json()
          btn.disabled = false
          btn.textContent = '▶ Play'
          btn.addEventListener('click', () => window.open(url, '_blank'))
        } catch {
          btn.textContent = 'Unavailable'
        }
      })
    } catch (e) {
      console.error('recordings', e)
    }
  }

  // Panel 4 — settings
  async function loadSettings() {
    try {
      const prefs = await rpc('get_prefs')
      hide('settings-loading')
      show('settings-content')

      // Nav name
      if (prefs.email) {
        // host_name not in get_prefs — use email as fallback
        setText('nav-name', prefs.email.split('@')[0])
      }

      // notify toggle
      const toggle = document.getElementById('notify-toggle')
      const label  = document.getElementById('notify-label')
      toggle.checked = !!prefs.notify_global
      label.textContent = prefs.notify_global ? 'On' : 'Off'

      toggle.addEventListener('change', async () => {
        const st = document.getElementById('notify-status')
        label.textContent = toggle.checked ? 'On' : 'Off'
        try {
          await rpc('set_prefs', { p_notify_global: toggle.checked })
          st.className = 'save-status ok'
          st.textContent = '✓ Saved'
          setTimeout(() => { st.textContent = '' }, 2500)
        } catch {
          st.className = 'save-status err'
          st.textContent = 'Could not save.'
        }
      })

      // frequency
      const freqSel = document.getElementById('freq-select')
      freqSel.value = prefs.frequency_mode || 'weekly'

      document.getElementById('freq-save-btn')
        .addEventListener('click', async () => {
          const st = document.getElementById('freq-status')
          try {
            await rpc('set_prefs', {
              p_notify_global:   toggle.checked,
              p_frequency_mode:  freqSel.value
            })
            st.className = 'save-status ok'
            st.textContent = '✓ Saved'
            setTimeout(() => { st.textContent = '' }, 2500)
          } catch {
            st.className = 'save-status err'
            st.textContent = 'Could not save.'
          }
        })

      // timezone
      buildTzSelect(prefs.time_zone)

      document.getElementById('tz-save-btn')
        .addEventListener('click', async () => {
          const st  = document.getElementById('tz-status')
          const tz  = document.getElementById('tz-select').value
          try {
            await rpc('set_prefs', {
              p_notify_global: toggle.checked,
              p_time_zone:     tz
            })
            st.className = 'save-status ok'
            st.textContent = '✓ Saved'
            setTimeout(() => { st.textContent = '' }, 2500)
          } catch {
            st.className = 'save-status err'
            st.textContent = 'Could not save.'
          }
        })

    } catch (e) {
      console.error('settings', e)
    }
  }

  function buildTzSelect(saved) {
    const sel      = document.getElementById('tz-select')
    const detected = saved ||
      Intl.DateTimeFormat().resolvedOptions().timeZone
    let matched = false

    TZ_OPTIONS.forEach(([val, label]) => {
      const opt = document.createElement('option')
      opt.value = val
      opt.textContent = label
      if (val === detected) { opt.selected = true; matched = true }
      sel.appendChild(opt)
    })

    if (!matched) {
      const opt = document.createElement('option')
      opt.value = detected
      opt.textContent = detected
      opt.selected = true
      sel.insertBefore(opt, sel.firstChild)
    }
  }

  function esc(s) {
    if (s == null) return ''
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
  }

  // ── INIT ─────────────────────────────────────────────────

  async function init() {
    const { data: { session } } = await sb.auth.getSession()
    if (session) {
      await loadDashboard()
    }
    // else: gate is already visible
  }

  init()
</script>
</body>
</html>
